name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: SwiftPM tests
        run: swift test --disable-sandbox

      - name: SwiftPM release build
        run: swift build -c release --disable-sandbox

      - name: Validate local StoreKit contract
        run: |
          jq -e '
            (.products | length) == 1 and
            .products[0].productID == "com.kikuai.kyuva.pro.lifetime" and
            .products[0].type == "NonConsumable" and
            .products[0].displayPrice == "24.99" and
            .settings._storefront == "IRL"
          ' AppStore/KyuvaPro.storekit >/dev/null
          xmllint --noout Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva.xcscheme
          xmllint --noout 'Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva iOS.xcscheme'
          git grep -n -F 'identifier = "../../AppStore/KyuvaPro.storekit"' -- Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva.xcscheme 'Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva iOS.xcscheme'
          git grep -n -F 'key = "KYUVA_LOCAL_STOREKIT_TESTING"' -- Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva.xcscheme 'Kyuva.xcodeproj/xcshareddata/xcschemes/Kyuva iOS.xcscheme'

      - name: Xcode release build
        run: >-
          xcodebuild -project Kyuva.xcodeproj -scheme Kyuva -configuration Release
          -destination 'platform=macOS,arch=${{ matrix.arch }}'
          ARCHS=${{ matrix.arch }} ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          -derivedDataPath "$RUNNER_TEMP/KyuvaDerivedData" build

      - name: Validate release bundle
        run: |
          KYUVA_APP="$RUNNER_TEMP/KyuvaDerivedData/Build/Products/Release/Kyuva.app"
          KYUVA_PRIVACY_MANIFEST="$KYUVA_APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$KYUVA_PRIVACY_MANIFEST"
          plutil -lint "$KYUVA_PRIVACY_MANIFEST"
          lipo "$KYUVA_APP/Contents/MacOS/Kyuva" -verify_arch "${{ matrix.arch }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KYUVA_APP/Contents/Info.plist")" = "com.kikuai.kyuva"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$KYUVA_APP/Contents/Info.plist")" = "1.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KYUVA_APP/Contents/Info.plist")" = "6"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$KYUVA_APP/Contents/Info.plist")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$KYUVA_APP/Contents/Info.plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' "$KYUVA_APP/Contents/Info.plist")" = "© 2026 Mykyta Dudnichenko. All rights reserved."
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$KYUVA_APP/Contents/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$KYUVA_APP/Contents/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' Kyuva/Resources/Kyuva.entitlements)" = "true"
          ! /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$KYUVA_APP/Contents/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$KYUVA_APP/Contents/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.server' Kyuva/Resources/Kyuva.entitlements >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' Kyuva/Resources/Kyuva.entitlements >/dev/null 2>&1
          ! strings "$KYUVA_APP/Contents/MacOS/Kyuva" | grep -Eq '_kyuva\._tcp|NWListener|LocalRemote|Start Local Remote|Control this Mac'
          ! strings "$KYUVA_APP/Contents/MacOS/Kyuva" | grep -F 'KYUVA_LOCAL_STOREKIT_TESTING'
          ! find "$KYUVA_APP" -name '*.storekit' -print -quit | grep -q .
          ! git grep -n -E 'LocalRemoteServer|LocalRemoteProtocol|LocalRemoteSecurity|_kyuva\._tcp|NWListener' -- Kyuva KyuvaMobile Kyuva.xcodeproj/project.pbxproj
          otool -L "$KYUVA_APP/Contents/MacOS/Kyuva" | grep -q '/Speech.framework/'
          git grep -n -F 'requiresOnDeviceRecognition = true' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'localesSupportingOnDeviceRecognition' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'supportsOnDeviceRecognition == true' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'static var commerceEnabled: Bool' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F 'KYUVA_LOCAL_STOREKIT_TESTING' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F '#if DEBUG' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F '#else' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F 'false' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F 'com.kikuai.kyuva.pro.lifetime' -- Kyuva/Core/ProEntitlementStore.swift

  mobile:
    name: iPhone and Apple Watch
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: iOS release build
        run: >-
          xcodebuild -project Kyuva.xcodeproj -scheme 'Kyuva iOS' -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          -derivedDataPath "$RUNNER_TEMP/KyuvaMobileDerivedData" build

      - name: watchOS release build
        run: >-
          xcodebuild -project Kyuva.xcodeproj -scheme 'Kyuva Watch App' -configuration Release
          -destination 'generic/platform=watchOS' CODE_SIGNING_ALLOWED=NO
          -derivedDataPath "$RUNNER_TEMP/KyuvaWatchDerivedData" build

      - name: Validate mobile bundles
        run: |
          KYUVA_IOS_APP="$RUNNER_TEMP/KyuvaMobileDerivedData/Build/Products/Release-iphoneos/Kyuva iOS.app"
          KYUVA_WATCH_APP="$KYUVA_IOS_APP/Watch/Kyuva Watch App.app"
          test -f "$KYUVA_IOS_APP/PrivacyInfo.xcprivacy"
          test -f "$KYUVA_WATCH_APP/PrivacyInfo.xcprivacy"
          plutil -lint "$KYUVA_IOS_APP/PrivacyInfo.xcprivacy"
          plutil -lint "$KYUVA_WATCH_APP/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KYUVA_IOS_APP/Info.plist")" = "com.kikuai.kyuva"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KYUVA_IOS_APP/Info.plist")" = "4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KYUVA_WATCH_APP/Info.plist")" = "com.kikuai.kyuva.watchkitapp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KYUVA_WATCH_APP/Info.plist")" = "4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKApplication' "$KYUVA_WATCH_APP/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$KYUVA_WATCH_APP/Info.plist")" = "com.kikuai.kyuva"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$KYUVA_IOS_APP/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$KYUVA_IOS_APP/Info.plist")"
          ! /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$KYUVA_WATCH_APP/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$KYUVA_WATCH_APP/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$KYUVA_IOS_APP/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$KYUVA_IOS_APP/Info.plist" >/dev/null 2>&1
          ! git grep -n -i -E 'MobileMacRemoteView|MacRemoteClient|openMacRemote|iphoneMacRemote|Control a Mac' -- KyuvaMobile Kyuva.xcodeproj/project.pbxproj
          ! strings "$KYUVA_IOS_APP/Kyuva iOS" | grep -F 'KYUVA_LOCAL_STOREKIT_TESTING'
          ! find "$KYUVA_IOS_APP" -name '*.storekit' -print -quit | grep -q .
          otool -L "$KYUVA_IOS_APP/Kyuva iOS" | grep -q '/Speech.framework/'
          git grep -n -F 'requiresOnDeviceRecognition = true' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'localesSupportingOnDeviceRecognition' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'supportsOnDeviceRecognition == true' -- Kyuva/Core/OnDeviceSpeechRecognizer.swift
          git grep -n -F 'static var commerceEnabled: Bool' -- Kyuva/Core/ProEntitlementStore.swift
          git grep -n -F 'KYUVA_LOCAL_STOREKIT_TESTING' -- Kyuva/Core/ProEntitlementStore.swift
